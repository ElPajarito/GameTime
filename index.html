<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAMEtime — the game room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Russo+One&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- boot flash: quick power-on line -->
  <div class="boot" id="boot" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#" onclick="return false"><span class="brand-tile">▶</span>GAME<span class="brand-alt">time</span></a>
    <div class="search-wrap">
      <input type="search" id="searchBox" placeholder="SEARCH…" autocomplete="off" spellcheck="false">
    </div>
    <nav class="top-actions">
      <button class="top-btn" id="homeBtn" title="Back to the room (Esc)">⌂</button>
      <button class="top-btn" id="soundBtn" title="Sound on/off" aria-pressed="false">♪</button>
      <button class="top-btn" id="crtBtn" title="TV screen effect on/off" aria-pressed="true">CRT</button>
    </nav>
  </header>

  <!-- search results drop-down -->
  <div class="search-overlay" id="searchOverlay" hidden></div>

  <!-- ================= THE ROOM: three divisions, camera pans ================= -->
  <div class="world" id="world" data-view="landing">

    <!-- ---------- DIVISION 1 · TO PLAY · the backlog storm ---------- -->
    <section class="division div-library" id="divLibrary">
      <div class="st-sky" aria-hidden="true"></div>
      <div class="st-floor" aria-hidden="true"></div>
      <div class="st-eye" aria-hidden="true"></div>
      <div class="st-fx" id="stormFx" aria-hidden="true"></div>

      <div class="division-head">
        <h2 class="sign sign-toplay">TO PLAY <span class="sign-count" id="countToplay">0</span></h2>
      </div>

      <button class="fd-toggle" data-dock="filtersLib">FILTERS</button>
      <aside class="filter-dock" id="filtersLib"></aside>

      <div class="funnel" id="funnel" aria-label="Backlog storm"></div>

      <div class="division-hint">drag to spin · scroll to rise through the funnel · click a cover</div>
      <div class="back-nav"><button class="land-btn" data-goto="landing">HOME ▶</button></div>
    </section>

    <!-- ---------- DIVISION 2 · LANDING · the big modern TV ---------- -->
    <section class="division div-landing" id="divLanding">
      <svg class="room-frame" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <g class="ln">
          <g transform="translate(70 96)">
            <rect width="200" height="270" rx="6" fill="#f2ead8"/>
            <rect x="15" y="15" width="170" height="186" fill="#3f8f8f"/>
            <circle cx="100" cy="92" r="44" fill="#e8763a"/>
            <rect x="15" y="220" width="170" height="13" fill="#d8564a"/>
            <rect x="15" y="243" width="110" height="9" fill="#c9bfa8"/>
          </g>
          <g transform="translate(1330 128)">
            <rect width="180" height="236" rx="6" fill="#f2ead8"/>
            <rect x="13" y="13" width="154" height="160" fill="#4a6fb5"/>
            <path d="M26 150 L66 90 L98 132 L126 98 L154 150 Z" fill="#1b1523"/>
            <rect x="13" y="188" width="154" height="12" fill="#e8763a"/>
          </g>
          <g transform="translate(1290 430)">
            <rect x="-8" y="112" width="330" height="15" rx="4" fill="#8a5a34"/>
            <rect x="10" y="32" width="32" height="80" fill="#e8763a"/>
            <rect x="48" y="24" width="28" height="88" fill="#3f8f8f"/>
            <rect x="82" y="38" width="34" height="74" fill="#f2ead8"/>
            <rect x="122" y="28" width="26" height="84" fill="#4a6fb5"/>
            <rect x="154" y="42" width="32" height="70" fill="#d8564a"/>
          </g>
          <rect x="-40" y="742" width="1680" height="30" rx="8" fill="#a9713f"/>
          <rect x="-40" y="768" width="1680" height="200" fill="#7b4d29"/>
          <g transform="translate(40 620)">
            <rect x="0" y="70" width="210" height="50" rx="8" fill="#efe3cb"/>
            <rect x="16" y="84" width="100" height="10" rx="3" fill="#c9bfa8"/>
            <rect x="150" y="82" width="22" height="14" rx="3" fill="#d8564a"/>
            <rect x="36" y="24" width="126" height="48" rx="5" fill="#c9bfa8"/>
            <rect x="52" y="34" width="94" height="26" rx="3" fill="#e8763a"/>
          </g>
          <g transform="translate(1300 596)">
            <rect x="0" y="94" width="250" height="120" rx="12" fill="#efe3cb"/>
            <circle cx="58" cy="152" r="34" fill="#3a3a42"/><circle cx="58" cy="152" r="16" fill="#8c8a86"/>
            <circle cx="192" cy="152" r="34" fill="#3a3a42"/><circle cx="192" cy="152" r="16" fill="#8c8a86"/>
            <rect x="102" y="120" width="46" height="28" rx="4" fill="#c9bfa8"/>
            <rect x="98" y="160" width="54" height="9" rx="3" fill="#d8564a"/>
            <rect x="30" y="74" width="190" height="9" rx="4" fill="#8c8a86"/>
          </g>
          <g transform="translate(276 690)">
            <rect x="0" y="26" width="74" height="150" rx="5" fill="#3f8f8f" transform="rotate(-6 37 101)"/>
            <rect x="44" y="36" width="70" height="140" rx="5" fill="#e8763a" transform="rotate(3 79 106)"/>
          </g>
          <g transform="translate(1160 726)">
            <rect x="0" y="0" width="38" height="70" rx="7" fill="#d8564a"/>
            <rect x="0" y="24" width="38" height="16" fill="#f2ead8"/>
            <ellipse cx="19" cy="3" rx="19" ry="6" fill="#c9bfa8"/>
          </g>
          <path d="M520 790 C 460 840, 360 838, 300 880" fill="none" stroke="#2a222f" stroke-width="9" stroke-linecap="round"/>
          <path d="M1090 792 C 1160 840, 1240 840, 1300 884" fill="none" stroke="#2a222f" stroke-width="9" stroke-linecap="round"/>
        </g>
      </svg>

      <div class="tv-rig" id="tvRig">
        <div class="tv-modern off" id="tv">
          <div class="tv-screen" id="tvScreen">
            <div class="tv-off-text" id="tvOffText">
              <span class="off-badge">⏻</span>
              <span>PRESS POWER</span>
            </div>

            <!-- 4 x 3 channel grid -->
            <div class="tv-grid" id="tvGrid" hidden></div>

            <!-- a channel playing full screen -->
            <div class="tv-show" id="tvShow" hidden>
              <img class="tv-cover" id="tvCover" alt="">
              <div class="tv-caption">
                <div class="tv-now">NOW PLAYING</div>
                <div class="tv-title" id="tvTitle"></div>
                <div class="tv-progress" id="tvProgress"></div>
                <button class="tv-back" id="tvBack">◀ CHANNELS</button>
              </div>
            </div>

            <div class="screen-fx" aria-hidden="true"></div>
          </div>

          <div class="tv-bezel">
            <span class="tv-logo">GT·VISION</span>
            <span class="tv-led" id="tvLed"></span>
            <button class="tv-power" id="tvKnob" title="Power">⏻</button>
          </div>
        </div>
        <div class="tv-neck" aria-hidden="true"></div>
        <div class="tv-foot" aria-hidden="true"></div>
      </div>

      <div class="land-nav">
        <button class="land-btn" id="btnSelect">◀ TO PLAY <b id="lblToplay">0</b></button>
        <button class="land-btn" id="btnStart"><b id="lblPlayed">0</b> PLAYED ▶</button>
      </div>
    </section>

    <!-- ---------- DIVISION 3 · PLAYED · the pokedex desk ---------- -->
    <section class="division div-pokedex" id="divPokedex">
      <div class="desk-scene" aria-hidden="true">
        <div class="desk-lamp-glow"></div>
        <div class="desk-surface"></div>
      </div>

      <div class="division-head">
        <h2 class="sign sign-played">PLAYED <span class="sign-count" id="countPlayed">0</span></h2>
      </div>

      <button class="fd-toggle" data-dock="filtersDex">FILTERS</button>
      <aside class="filter-dock" id="filtersDex"></aside>

      <div class="dex-stage" id="dexStage">
        <div class="dex" id="dex" data-open="false">
          <div class="dex-book">
            <div class="dex-lid" id="dexLid">
              <div class="lid-cover">
                <div class="lens"><i></i></div>
                <div class="lid-leds"><i class="led-r"></i><i class="led-y"></i><i class="led-g"></i></div>
                <div class="lid-word">GAME·DEX</div>
                <div class="lid-tap">▲ OPEN</div>
              </div>
              <div class="lid-screen">
                <div class="dex-screen" id="dexScreen">
                  <div class="dex-screen-empty" id="dexScreenEmpty">SELECT A GAME →</div>
                  <div class="dex-screen-body" id="dexScreenBody" hidden>
                    <div class="dex-cover-wrap" id="dexCoverWrap"></div>
                    <div class="dex-name" id="dexName"></div>
                    <div class="dex-hearts" id="dexHearts"></div>
                    <div class="dex-meta" id="dexMeta"></div>
                    <button class="dex-more" id="dexMore">▶ MORE</button>
                  </div>
                </div>
                <div class="dex-hinge-leds"><i></i><i></i></div>
              </div>
            </div>
            <div class="dex-base">
              <div class="dex-grid-wrap">
                <div class="dex-grid" id="dexGrid"></div>
              </div>
              <div class="dex-base-panel">
                <div class="dex-dpad" aria-hidden="true"><i class="v"></i><i class="h"></i><i class="c"></i></div>
                <div class="dex-blue-btns" aria-hidden="true"><i></i><i></i></div>
                <div class="dex-avg" id="dexAvg"></div>
              </div>
            </div>
          </div>
          <!-- POV hand that flips the lid -->
          <svg class="dex-hand" id="dexHand" viewBox="0 0 120 140" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="division-hint">tap the dex to flip it open · click a cover to inspect</div>
      <div class="back-nav"><button class="land-btn" data-goto="landing">◀ HOME</button></div>
    </section>
  </div>

  <!-- ================= detail modal (RPG dialog box) ================= -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
